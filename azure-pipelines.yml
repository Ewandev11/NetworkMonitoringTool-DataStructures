trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- script: |
    echo "Checking build machine Java environment..."
    java -version
    javac -version
    
    echo "Starting compilation of your Java Network Monitoring Tool..."
    javac *.java
    echo "Compilation successful! No syntax or structure errors found."
  displayName: 'Verify and Compile Java Source Code'
